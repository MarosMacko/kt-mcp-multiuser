# kt-mcp + Caddy (automatic HTTPS). Everything is configured in .env:
#
#   cp .env.example .env      # fill in KT_DOMAIN, CREDENTIALS_KEY, OPERATOR_*
#   BUILD_COMMIT=$(git rev-parse --short HEAD) docker compose up -d --build
#
# BUILD_COMMIT only labels the build (page footer, /healthz); leaving it out
# shows the version without a commit.
# Full guide: docs/SELF-HOSTING.md ("Variant A").
services:
  kt-mcp:
    build:
      context: .
      args:
        BUILD_COMMIT: ${BUILD_COMMIT:-}
    image: kt-mcp:latest
    restart: unless-stopped
    env_file: .env
    environment:
      PUBLIC_URL: https://${KT_DOMAIN:?set KT_DOMAIN in .env}
      HOST: 0.0.0.0
      PORT: 8092
      STATE_DIR: /data
      TRUST_PROXY_HOPS: 1
    volumes:
      - kt-mcp-state:/data
    # No published port: only Caddy talks to it, over the compose network.

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      KT_DOMAIN: ${KT_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - kt-mcp

volumes:
  kt-mcp-state:
  caddy-data:
  caddy-config:
